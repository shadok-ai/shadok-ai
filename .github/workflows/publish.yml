name: Publish

# Auto-publish on every merge to main (pre-stable mode). The version is bumped
# in-CI only, never committed or pushed — the repo's package.json carries the
# <major>.<minor> and a 0 patch, and bumping its MINOR is what promotes.
#
# TWO CHANNELS (docs/superpowers/specs/2026-08-23-update-channels-design.md):
#
#   ordinary merge → <major>.<minor>.<commits since the minor began>,
#                    published `--tag alpha`
#   minor bump     → the same rule gives .0, published with NO tag, which moves
#                    `latest` — the beta channel
#
# Only `npm publish` is ever used, never `npm dist-tag add`: OIDC trusted
# publishing authenticates publish and nothing else, so moving a tag afterwards
# would mean storing a long-lived npm token as a repository secret.
#
# Auth is npm Trusted Publishing via GitHub OIDC — NO token. One-time setup on
# npmjs.com: package `shadok-ai` → Settings → Trusted Publisher → GitHub
# Actions, repo shadok-ai/shadok-ai, workflow `publish.yml`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history for the commit count
      # TWO Node versions on purpose, and the split is load-bearing.
      #
      # The tests run on 20, the same version ci.yml uses. They were running on
      # 22 here, where `node-pty` fails to load its native module — so
      # test/telegram.test.ts and test/tmux-stop.test.ts died, `npm test`
      # returned 1, and the publish aborted while the PR's own `verify` was
      # green. A gate that only the release path can fail is a gate nobody sees
      # until a version silently stops shipping.
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # must match ci.yml: node-pty's binary loads here
          cache: npm
      - run: npm ci
      - run: npm test

      # Publishing needs a newer Node than the tests can use: OIDC trusted
      # publishing requires >= 22.14. Switching here is safe because nothing
      # past this point loads a native module — `prepublishOnly` only runs tsc.
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # OIDC trusted publishing needs Node >= 22.14
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # OIDC needs npm >= 11.5.1
      - name: Decide channel and version
        id: ver
        run: |
          # ONE rule for the number: `<major>.<minor>.<commits since this minor
          # began>`. The patch restarts at 0 on every promotion, so a version
          # says where it sits INSIDE its generation — 0.6.4 is the fourth merge
          # of the 0.6 line, not the 4th commit of the repository.
          #
          # A promotion falls out of that rule rather than being a special case:
          # the promoting merge IS the commit that set the minor, so its count is
          # 0 and it publishes `<major>.<minor>.0`. The previous version of this
          # step special-cased it, and before that it published the global commit
          # count — which gave 0.3.77, a number that reads as the 77th patch of a
          # 0.3 series whose 0.3.0 through 0.3.76 never existed.
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          LATEST=$(npm view shadok-ai@latest version 2>/dev/null || echo "")
          LATEST_BASE=$(echo "$LATEST" | cut -d. -f1,2)

          # Where this minor began: walk the commits that touched package.json,
          # newest first, and keep the last one still carrying BASE. Needs the
          # full history — hence fetch-depth: 0 on checkout.
          PROM=""
          for c in $(git log --format=%H -- package.json); do
            v=$(git show "$c:package.json" 2>/dev/null \
                  | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).version}catch(e){''}")
            if [ "$(echo "$v" | cut -d. -f1,2)" = "$BASE" ]; then PROM="$c"; else break; fi
          done
          # No such commit (a shallow clone, a rewritten history): fall back to
          # the global count. A version too HIGH is harmless — it still sorts
          # after everything published — whereas 0 would collide with a promotion.
          if [ -n "$PROM" ]; then COUNT=$(git rev-list --count "$PROM..HEAD"); else COUNT=$(git rev-list --count HEAD); fi

          # Promotion is read from the REGISTRY, never from git history, so a
          # workflow re-run or a replay reaches the same verdict instead of
          # promoting twice.
          if [ -n "$LATEST" ] && [ "$BASE" = "$LATEST_BASE" ]; then
            echo "promote=0" >> "$GITHUB_OUTPUT"
          else
            echo "promote=1" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${BASE}.${COUNT}" >> "$GITHUB_OUTPUT"
          echo "latest is ${LATEST:-none}, package.json is $BASE, minor began at ${PROM:-unknown} (+${COUNT})"
      - name: Publish if new
        run: |
          V="${{ steps.ver.outputs.version }}"
          if npm view "shadok-ai@$V" version >/dev/null 2>&1; then
            echo "shadok-ai@$V already published — skipping"
            exit 0
          fi
          npm version "$V" --no-git-tag-version --allow-same-version
          if [ "${{ steps.ver.outputs.promote }}" = "1" ]; then
            # No --tag: that is what moves `latest`, i.e. the beta channel.
            echo "promoting $V to latest (beta channel)"
            npm publish --access public
          else
            echo "publishing $V to the alpha channel (latest is untouched)"
            npm publish --access public --tag alpha
          fi
