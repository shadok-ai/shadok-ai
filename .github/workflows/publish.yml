name: Publish

# Auto-publish on every merge to main (pre-stable mode): the version is
# <major>.<minor> from package.json + the commit count as patch, e.g. 0.1.42.
# Bumped in-CI only (never committed/pushed).
#
# TWO CHANNELS (docs/superpowers/specs/2026-08-23-update-channels-design.md):
# an ordinary merge publishes under the `alpha` dist-tag; a MINOR BUMP in
# package.json publishes with no tag, which is what moves `latest` — the beta
# channel. Only `npm publish` is used, never `npm dist-tag add`: OIDC trusted
# publishing authenticates publish and nothing else, so moving a tag afterwards
# would mean storing a long-lived npm token as a repository secret. Auth is npm Trusted Publishing via
# GitHub OIDC — NO token. One-time setup on npmjs.com: package `shadok-ai` →
# Settings → Trusted Publisher → GitHub Actions, repo shadok-ai/shadok-ai,
# workflow `publish.yml`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history for the commit count
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # OIDC trusted publishing needs Node >= 22.14
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # OIDC needs npm >= 11.5.1
      - run: npm ci
      - run: npm test
      - name: Compute version (major.minor.commitcount)
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          COUNT=$(git rev-list --count HEAD)
          echo "version=${BASE}.${COUNT}" >> "$GITHUB_OUTPUT"
      - name: Publish if new
        run: |
          V="${{ steps.ver.outputs.version }}"
          if npm view "shadok-ai@$V" version >/dev/null 2>&1; then
            echo "shadok-ai@$V already published — skipping"
            exit 0
          fi
          # Promotion is decided from the REGISTRY, not from git history: if the
          # minor we are about to publish differs from the one `latest` points
          # at, this merge is the promotion. Stateless, so a re-run or a replay
          # reaches the same verdict instead of promoting twice.
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          LATEST=$(npm view shadok-ai@latest version 2>/dev/null || echo "")
          LATEST_BASE=$(echo "$LATEST" | cut -d. -f1,2)
          npm version "$V" --no-git-tag-version --allow-same-version
          if [ -n "$LATEST" ] && [ "$BASE" = "$LATEST_BASE" ]; then
            echo "publishing $V to the alpha channel (latest stays at $LATEST)"
            npm publish --access public --tag alpha
          else
            echo "minor bump ${LATEST_BASE:-none} → $BASE: promoting $V to latest (beta channel)"
            npm publish --access public
          fi
